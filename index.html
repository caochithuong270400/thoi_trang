<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thời Trang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #000;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  /*
    --u = kích thước 1 pixel của ảnh gốc (720x596) trên màn hình.
    Tự nhỏ lại trên điện thoại, lớn lên trên màn hình to.
  */
  .laptop {
    --u: clamp(0.3px, calc(min(100vw, 100dvh) / 900), 1.3px);
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
  }

  /* ===== Màn hình (nội dung web) ===== */
  .screen {
    position: absolute;
    top:    calc(52  * var(--u));
    left:   calc(55  * var(--u));
    right:  calc(74  * var(--u));
    bottom: calc(100 * var(--u));
    background: #fff;
    overflow: auto;
    z-index: 1;
  }

  /* ===== Khung ghép từ các mảnh (9-slice mở rộng) ===== */
  .frame {
    position: absolute; inset: 0;
    display: grid;
    grid-template-rows: calc(60 * var(--u)) minmax(0, 1fr) calc(126 * var(--u));
    pointer-events: none;   /* click xuyên qua khung */
    user-select: none;
    z-index: 2;
  }
  .row { display: flex; min-height: 0; height: 100%; overflow: hidden; }
  .row img { display: block; height: 100%; }
  .row img.fixed   { flex: none; }                  /* giữ nguyên tỉ lệ (sticker, logo, góc) */
  .row img.stretch { flex: 1 1 0; min-width: 0; }   /* phần xám trơn, kéo giãn */
  .row.mid { justify-content: space-between; }
  .row.mid img { height: 100%; }

  /* chiều rộng mảnh cố định = chiều rộng gốc * --u */
  .w55  { width: calc(55  * var(--u)); }
  .w60  { width: calc(60  * var(--u)); }
  .w74  { width: calc(74  * var(--u)); }
  .w80  { width: calc(80  * var(--u)); }
  .w115 { width: calc(115 * var(--u)); }
  .w165 { width: calc(165 * var(--u)); }
  .w210 { width: calc(210 * var(--u)); }
  /* chia phần giãn theo tỉ lệ gốc để notch/logo vẫn gần giữa */
  .g255 { flex-grow: 255 !important; }
  .g115 { flex-grow: 115 !important; }
  .g135 { flex-grow: 135 !important; }
  .g140 { flex-grow: 140 !important; }

</style>
</head>
<body>
  <div class="laptop">
    <main class="screen">
      <!-- Màn hình tiêu đề -->
      <section id="title-screen" class="view title-view">
        <h1 class="logo">Thời Trang</h1>
        <button class="px-btn big" id="btn-start">BẮT ĐẦU</button>
      </section>

      <!-- Màn hình game -->
      <section id="game-screen" class="view game-view" hidden>
        <div class="stage-col">
          <button class="px-btn round" id="btn-home" aria-label="Về màn hình chính">
            <svg viewBox="0 0 9 9" shape-rendering="crispEdges" fill="currentColor">
              <rect x="4" y="1" width="1" height="1"/><rect x="3" y="2" width="3" height="1"/>
              <rect x="2" y="3" width="5" height="1"/><rect x="1" y="4" width="7" height="1"/>
              <rect x="2" y="5" width="2" height="3"/><rect x="5" y="5" width="2" height="3"/>
              <rect x="4" y="5" width="1" height="1"/>
            </svg>
          </button>
          <div class="stage">
            <svg id="doll" viewBox="120 0 810 1380" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
          <!-- Ngẫu nhiên / Xóa: góc dưới trái -->
          <div class="stage-actions" id="stage-actions"></div>
          <!-- Biểu tượng loại đồ: góc dưới phải -->
          <nav class="catbar" id="catbar" aria-label="Loại đồ"></nav>
        </div>

        <aside class="wardrobe" id="wardrobe"></aside>
      </section>
    </main>

    <div class="frame" aria-hidden="true">
      <div class="row top">
        <img class="fixed w60"     src="frame/t1.png" alt="">
        <img class="stretch g255"  src="frame/t2.png" alt="">
        <img class="fixed w210"    src="frame/t3.png" alt="">
        <img class="stretch g115"  src="frame/t4.png" alt="">
        <img class="fixed w80"     src="frame/t5.png" alt="">
      </div>
      <div class="row mid">
        <img class="w55" src="frame/ml.png" alt="">
        <img class="w74" src="frame/mr.png" alt="">
      </div>
      <div class="row bottom">
        <img class="fixed w165"    src="frame/b1.png" alt="">
        <img class="stretch g135"  src="frame/b2.png" alt="">
        <img class="fixed w115"    src="frame/b3.png" alt="">
        <img class="stretch g140"  src="frame/b4.png" alt="">
        <img class="fixed w165"    src="frame/b5.png" alt="">
      </div>
    </div>
  </div>
  <script src="assets/items/items.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
